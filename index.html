<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volontär & Digital kö</title>
</head>

<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto;">

<h2>Humanity First Sverige</h2>

<div id="app"></div>

<script>
const SUPABASE_URL = 'https://azmvdeynrqaldlqsmwkt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6bXZkZXlucnFhbGRscXNtd2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNjAxODYsImV4cCI6MjA5MDczNjE4Nn0.GTKzntDmk4bV1bomnzPPr3Xs0IuwqjuoIv7XSvi3F9M';

async function api(path, options={}) {
  const url = SUPABASE_URL + path;
  const res = await fetch(url, {
    method: options.method || "GET",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: options.body
  });

  if(!res.ok) {
    const text = await res.text();
    throw new Error(text);
  }

  return res.json();
}

async function load() {
  try {
    const events = await api('/rest/v1/events?select=*');

    if (!events.length) {
      document.getElementById("app").innerHTML = "<b>Ingen aktivitet just nu</b>";
      return;
    }

    document.getElementById("app").innerHTML =
      events.map(e => `
        <div style="border:1px solid #ccc;padding:10px;margin:10px 0;">
          <b>${e.day_name}</b><br>
          ${e.date}
        </div>
      `).join("");

  } catch (e) {
    document.getElementById("app").innerHTML =
      "<b>Fel:</b><br>" + e.message;
  }
}

load();
</script>

</body>
</html>
